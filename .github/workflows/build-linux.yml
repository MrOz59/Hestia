---
# Linux compile/link CI for Hestia.
#
# This is intentionally a "does it build?" job, not a packaging job: it uses the
# distro's Qt and multimedia libraries (the exact qmake6 + make flow documented
# in the README) instead of compiling SDL/FFmpeg/libplacebo from source. That
# keeps it fast and reliable as the primary signal that the client still builds
# on Linux. AppImage packaging lives in build-appimage.yml and is opt-in.
name: Build - Linux
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string
      # The version the client reports (see build.yml); empty for the plain
      # app/version.txt number.
      build_version:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build (${{ matrix.arch }} / ${{ matrix.os }})
    env:
      CI_VERSION: ${{ inputs.ci_version }}
      # Read by app/app.pro.
      HESTIA_BUILD_VERSION: ${{ inputs.build_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            uname_arch: x86_64

          - os: ubuntu-24.04-arm
            arch: aarch64
            uname_arch: aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Verify runner architecture
        run: |
          RUNNER_ARCH="$(uname -m)"
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "Expected architecture: ${{ matrix.uname_arch }}"

          if [ "${RUNNER_ARCH}" != "${{ matrix.uname_arch }}" ]; then
            echo "::error::Unexpected runner architecture: ${RUNNER_ARCH}"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Base toolchain + Qt6 + QML modules, then the multimedia/codec and
          # windowing libraries app.pro consumes via pkg-config. Optional ones
          # (libva, vdpau, drm, libplacebo) are gated by packagesExist() in the
          # .pro, so a missing package degrades features rather than failing.
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config nasm cmake patchelf libvulkan-dev \
            qmake6 qt6-base-dev libqt6opengl6-dev \
            qt6-declarative-dev libqt6svg6-dev qt6-wayland \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libopus-dev libsdl2-dev libsdl2-ttf-dev libssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libva-dev libvdpau-dev libdrm-dev libplacebo-dev \
            libxkbcommon-dev wayland-protocols libwayland-dev libx11-dev

      - name: Build pinned PyroWave SDK
        run: bash scripts/build-pyrowave-sdk.sh

      - name: Test opaque frame validation under sanitizers
        run: |
          c++ -std=c++14 -g -fsanitize=address,undefined -I moonlight-common-c/moonlight-common-c/src tests/test_pyrowave_frame.cpp -o /tmp/test-pyrowave-frame
          /tmp/test-pyrowave-frame

      - name: Configure (qmake6)
        run: |
          qmake6 moonlight-qt.pro 2>&1 | tee /tmp/qmake.log
          grep -F 'PyroWave decoder selected' /tmp/qmake.log

      - name: Build (make release)
        run: make release -j"$(nproc)"

      - name: Verify binary was produced
        run: |
          test -x app/moonlight || {
            echo "::error::app/moonlight was not built"
            exit 1
          }

          file app/moonlight

          case "${{ matrix.arch }}" in
            x86_64)
              file app/moonlight | grep -Eq 'x86-64|x86_64' || {
                echo "::error::Binary is not x86_64"
                exit 1
              }
              ;;
            aarch64)
              file app/moonlight | grep -Eq 'ARM aarch64|aarch64' || {
                echo "::error::Binary is not AArch64"
                exit 1
              }
              ;;
          esac

      - name: Stage a versioned tarball
        run: |
          VERSION="${HESTIA_BUILD_VERSION:-$(cat app/version.txt)}"
          STAGE="hestia-${VERSION}-linux-${{ matrix.arch }}"

          mkdir -p "dist/${STAGE}"
          cp app/moonlight "dist/${STAGE}/moonlight"
          mkdir -p "dist/${STAGE}/lib" "dist/${STAGE}/licenses"
          cp -a build/pyrowave-sdk/install/lib/libpyrowave-shared.so* "dist/${STAGE}/lib/"
          cp -R build/pyrowave-sdk/install/share/licenses/pyrowave "dist/${STAGE}/licenses/"
          patchelf --set-rpath '$ORIGIN/lib' "dist/${STAGE}/moonlight"
          ldd "dist/${STAGE}/moonlight" | tee /tmp/staged-libraries.txt
          ! grep -F 'not found' /tmp/staged-libraries.txt

          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

          ls -l dist

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: Hestia-Linux-${{ matrix.arch }}-${{ matrix.os }}-${{ env.CI_VERSION }}
          path: dist/*.tar.gz
          if-no-files-found: error