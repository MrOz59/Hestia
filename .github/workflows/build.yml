---
name: Build
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - feature/pyrowave-codec
    paths-ignore:
      - 'tests/test_pyrowave_roundtrip.cpp'
      - '.github/workflows/pyrowave-roundtrip.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  # Manual runs can opt into the heavier / non-focus targets (AppImage
  # packaging, Steam Link, Windows, macOS) that aren't part of the default
  # push/PR signal.
  workflow_dispatch:
    inputs:
      build_appimage:
        description: 'Build the Linux AppImage package'
        type: boolean
        default: true
      build_steamlink:
        description: 'Build the Steam Link target'
        type: boolean
        default: false
      build_windows_macos:
        description: 'Build Windows and macOS (currently unsupported / best-effort)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ci_version is the short commit the artifact names carry. build_version is
  # the version the client reports and the packages are named after: the plain
  # app/version.txt number for a v* tag, and that number plus the commit as
  # SemVer build metadata (0.1.0+abc1234) for every other build, the way Hermes
  # stamps its nightlies. A nightly then says which commit it came from, and the
  # update checker can tell one nightly from the next.
  #
  # `+` is the separator every package format here accepts (Arch pkgver forbids
  # `-`), and as build metadata it sorts equal to the plain version instead of
  # below it: a nightly is 0.1.0 plus commits, not a 0.1.0 pre-release.
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
      version: ${{ steps.set-ci-version.outputs.version }}
      build_version: ${{ steps.set-ci-version.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          version="$(tr -d '[:space:]' < app/version.txt)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # The update checker compares the release tag with the version
            # the client reports, so a tag that disagrees with version.txt
            # would tell that release's own users to update, forever.
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match app/version.txt (${version}); bump version.txt in the tagged commit"
              exit 1
            fi
            build_version="${version}"
          else
            build_version="${version}+${GITHUB_SHA:0:7}"
          fi
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_version=${build_version}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${build_version}"

  # Primary signal: the client builds on Linux. Always runs.
  build-linux:
    needs: setup
    uses: ./.github/workflows/build-linux.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_version: ${{ needs.setup.outputs.build_version }}

  # Distributable package for the focus platform (Arch/CachyOS). Runs by default.
  build-arch:
    needs: setup
    uses: ./.github/workflows/build-arch.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_version: ${{ needs.setup.outputs.build_version }}

  # Portable AppImage. Runs by default (push/PR). It builds SDL/FFmpeg/libplacebo
  # from source, which is slow (~30-50 min) and more prone to breaking on a
  # pinned-dependency change, so it is kept non-blocking: the nightly/release
  # jobs gate only on the Linux and Arch builds (see their if:), so a failed
  # AppImage doesn't hold back a release. A manual dispatch can skip it via the
  # build_appimage input.
  #
  # NB: continue-on-error isn't valid on a job that uses a reusable workflow, so
  # the non-blocking behavior lives in the consumers' conditions instead.
  build-appimage:
    needs: setup
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_appimage }}
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_version: ${{ needs.setup.outputs.build_version }}

  # Opt-in targets. These only run on a manual dispatch with the matching input
  # enabled, so a red Windows/macOS build never blocks normal CI.

  build-steamlink:
    needs: setup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_steamlink }}
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_version: ${{ needs.setup.outputs.build_version }}

  build-windows-macos:
    needs: setup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows_macos }}
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      build_version: ${{ needs.setup.outputs.build_version }}

  # ===========================================
  # Tagged release (on a v* tag)
  # ===========================================
  release:
    # Wait for the AppImage too so it can be attached when it succeeds, but
    # always() ensures a failed/skipped AppImage doesn't block the release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-linux.result == 'success' && needs.build-arch.result == 'success' }}
    needs: [build-linux, build-arch, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Nightly (rolling prerelease on master)
  # ===========================================
  # Every successful push to master refreshes the single "nightly" prerelease
  # with the latest Linux artifacts. The tag is force-moved to the current
  # commit so the release always points at the newest build.
  nightly:
    # Wait for the AppImage so it can be bundled when it succeeds, but always()
    # ensures a failed/skipped AppImage still publishes the rest of the nightly.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.setup.result == 'success' && needs.build-linux.result == 'success' && needs.build-arch.result == 'success' }}
    needs: [setup, build-linux, build-arch, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Move nightly tag to current commit
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly"

      - name: Clear stale nightly assets
        run: |
          # Drop the old assets so a version bump never leaves stale-versioned
          # files behind. Ignores the case where the release doesn't exist yet.
          for asset in $(gh release view nightly --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset nightly "$asset" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          # The client's update checker reads the build version, commit
          # included, from this name: keep it in the name.
          name: "Hestia nightly (v${{ needs.setup.outputs.build_version }})"
          body: |
            Rolling nightly build of the Hestia client from the `master` branch.

            - Version: `v${{ needs.setup.outputs.build_version }}` (built on `v${{ needs.setup.outputs.version }}`)
            - Commit: ${{ github.sha }}

            > Artifacts are rebuilt on every push to `master` and may be
            > unstable. Linux is the focus platform (see the README). For stable
            > builds, see the tagged (non-prerelease) entries.
          files: artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
